# Isolates the token exchange from everything downstream of it. Sends the same
# request to /api/auth/token twice -- once bearing an access key, once bearing
# this job's OIDC token -- so a malformed request can be told apart from a
# credential Develocity will not accept. Both arms now return 200.
#
# Kept deliberately after the exchange started working: when publishing breaks,
# this answers "is it the credential or everything after it?" in about a minute,
# without a Gradle build in the way. It is how the 401 was pinned to the OIDC
# token rather than to the request shape.
#
# Requires the DEVELOCITY_ACCESS_KEY secret, which the access-key arm of
# build.yml also uses. Note the API needs the *bare* key while the Gradle plugin
# needs the host-qualified form, so this strips the prefix and build.yml does
# not.
name: probe-exchange

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare credentials against /api/auth/token
        env:
          DV: https://dv-self-paced-training.grdev.net
          ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: |
          set -uo pipefail

          exchange() { # $1 = label, $2 = bearer credential
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              "$DV/api/auth/token?expiresInHours=1" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $2" \
              --data '')
            echo "  $1 -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "     got a token of ${#code} status, body length $(wc -c </tmp/out)"
            else
              echo "     body: $(cat /tmp/out)"
            fi
          }

          # The secret may hold the "host=key" form, which the Gradle plugin
          # parses but which is not a bearer token. Use the bare key.
          bare="${ACCESS_KEY##*=}"
          echo "::add-mask::$bare"
          if [ "$bare" != "$ACCESS_KEY" ]; then
            echo "  (secret is in host=key form; using the bare key)"
          fi

          echo "== access key, /api/auth/token =="
          exchange "access key" "$bare"

          echo "== access key, /api/builds =="
          code=$(curl -sS -o /tmp/b -w '%{http_code}' \
            -H "Authorization: Bearer $bare" "$DV/api/builds?since=0&maxBuilds=1")
          echo "  /api/builds -> HTTP $code"
          echo "     body: $(head -c 200 /tmp/b)"

          oidc=$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DV}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$oidc"

          # Full structure of what GitHub actually sends. The decoded header and
          # payload are not secrets -- they describe the repository and the run,
          # and cannot authenticate anything without the signature, which is not
          # printed. JSON types are shown because Develocity's claim matcher
          # treats non-string claims as absent.
          echo "== token structure as received from GitHub =="
          python3 - "$oidc" <<'PY'
          import base64, json, sys

          def seg(s):
              s += "=" * (-len(s) % 4)
              return json.loads(base64.urlsafe_b64decode(s))

          head, payload, _ = sys.argv[1].split(".")

          print("--- JOSE header ---")
          print(json.dumps(seg(head), indent=2, sort_keys=True))

          claims = seg(payload)
          print(f"--- payload: {len(claims)} claims ---")
          print(json.dumps(claims, indent=2, sort_keys=True))

          print("--- claim types ---")
          for k in sorted(claims):
              v = claims[k]
              t = type(v).__name__
              note = ""
              if isinstance(v, list):
                  note = "  <-- ARRAY: Develocity treats array claims as absent"
              print(f"  {k:24} {t}{note}")
          PY

          echo "== OIDC token =="
          exchange "oidc" "$oidc"

          echo "== OIDC token, presented straight to the API =="
          code=$(curl -sS -o /tmp/api -w '%{http_code}' \
            -H "Authorization: Bearer $oidc" "$DV/api/builds?since=0&maxBuilds=1")
          echo "  /api/builds -> HTTP $code"
          echo "     body: $(head -c 300 /tmp/api)"
