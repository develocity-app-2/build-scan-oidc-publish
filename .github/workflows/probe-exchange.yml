# Minimal reproduction for the OIDC exchange returning 401. Sends the same
# request to /api/auth/token twice -- once bearing an access key, once bearing
# this job's OIDC token -- so a malformed request can be told apart from a token
# Develocity will not accept. The access key arm returns 200, the OIDC arm 401.
#
# Requires the DEVELOCITY_ACCESS_KEY secret, which nothing else here reads any
# more; delete this workflow along with the secret once the exchange works.
name: probe-exchange

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare credentials against /api/auth/token
        env:
          DV: https://dv-self-paced-training.grdev.net
          ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: |
          set -uo pipefail

          exchange() { # $1 = label, $2 = bearer credential
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              "$DV/api/auth/token?expiresInHours=1" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer $2" \
              --data '')
            echo "  $1 -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "     got a token of ${#code} status, body length $(wc -c </tmp/out)"
            else
              echo "     body: $(cat /tmp/out)"
            fi
          }

          # The secret may hold the "host=key" form, which the Gradle plugin
          # parses but which is not a bearer token. Use the bare key.
          bare="${ACCESS_KEY##*=}"
          echo "::add-mask::$bare"
          if [ "$bare" != "$ACCESS_KEY" ]; then
            echo "  (secret is in host=key form; using the bare key)"
          fi

          echo "== access key, /api/auth/token =="
          exchange "access key" "$bare"

          echo "== access key, /api/builds =="
          code=$(curl -sS -o /tmp/b -w '%{http_code}' \
            -H "Authorization: Bearer $bare" "$DV/api/builds?since=0&maxBuilds=1")
          echo "  /api/builds -> HTTP $code"
          echo "     body: $(head -c 200 /tmp/b)"

          oidc=$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DV}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$oidc"

          echo "== OIDC token =="
          exchange "oidc" "$oidc"

          echo "== OIDC token, presented straight to the API =="
          code=$(curl -sS -o /tmp/api -w '%{http_code}' \
            -H "Authorization: Bearer $oidc" "$DV/api/builds?since=0&maxBuilds=1")
          echo "  /api/builds -> HTTP $code"
          echo "     body: $(head -c 300 /tmp/api)"
