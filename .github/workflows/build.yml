name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No wrapper and no setup-gradle/setup-java: the runner image already has
      # Gradle 9.7.0 and JDK 21, so the job downloads nothing and the build's own
      # configuration is the only Develocity config in play.
      - name: Build
        run: gradle build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          # Static access key for now. This is the piece the experiment replaces
          # with a GitHub OIDC token exchange.
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
