name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Deliberately no gradle/actions/setup-gradle: it injects its own
      # Develocity init script and custom values, which would confound the
      # experiment. The wrapper is invoked directly.
      - name: Build
        run: ./gradlew build
        env:
          # Static access key for now. This is the piece the experiment replaces
          # with a GitHub OIDC token exchange.
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
