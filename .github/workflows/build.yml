name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Lets the OIDC cells mint a token describing the job. Without this the
  # exchange has nothing to present to Develocity.
  id-token: write

env:
  DEVELOCITY_URL: https://dv-self-paced-training.grdev.net

jobs:
  # Six cells: each project published under each credential. Both credentials
  # run in the same job definition, on the same commit and the same runner
  # generation, so a difference between them is attributable to the credential
  # and not to anything about when or where the run happened.
  publish:
    name: ${{ matrix.credential }} / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        credential: [access-key, oidc]
        project: [granted, forbidden, foreign, no-project-id]
        include:
          - project: granted
            expect: published
          - project: forbidden
            expect: denied
          # Another repository's project. Denial here is what makes the
          # single all-repositories workload identity safe: authenticating is
          # open to everyone, but each token reaches only its own project.
          - project: foreign
            expect: denied
          - project: no-project-id
            expect: project-required
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate by exchanging an OIDC token
        if: matrix.credential == 'oidc'
        uses: ./.github/actions/develocity-token
        with:
          server-url: ${{ env.DEVELOCITY_URL }}
          audience: ${{ env.DEVELOCITY_URL }}

      # The stored key may be in "host=key" form; the Gradle plugin parses both,
      # so it is passed through untouched. Only the REST API needs the bare key.
      - name: Authenticate with the stored access key
        if: matrix.credential == 'access-key'
        env:
          KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "DEVELOCITY_ACCESS_KEY secret is not set, so the access-key"
            echo "arm of the comparison cannot run."
            exit 1
          fi
          echo "DEVELOCITY_ACCESS_KEY=$KEY" >> "$GITHUB_ENV"

      # No wrapper and no setup-gradle/setup-java: the runner image already has
      # Gradle and JDK 21, so the job downloads no toolchain and the build's own
      # configuration is the only Develocity config in play.
      - name: Build and assert the outcome
        working-directory: projects/${{ matrix.project }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          set +e
          gradle build --console=plain 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          # Logged, not raised as an annotation: a refused publish still exits 0,
          # so this number says nothing about the outcome under test and reads as
          # a verdict when it is surfaced next to one.
          echo "gradle exited with $status"

          # One line per cell on the run summary, so the six outcomes can be read
          # side by side without opening each job.
          verdict() { echo "- **${{ matrix.credential }} / ${{ matrix.project }}** — $1" >> "$GITHUB_STEP_SUMMARY"; }

          # A refused publish does not fail the Gradle build, so the exit code
          # carries no signal. Match the server's specific response instead:
          # requiring the denial text, rather than merely the absence of a scan
          # URL, is what stops an unrelated failure from passing as proof of
          # isolation.
          published=false
          grep -qE 'grdev\.net/s/[a-z0-9]+' build.log && published=true

          case "${{ matrix.expect }}" in
            published)
              if $published; then
                echo "PASS: a Build Scan was published to the granted project."
                verdict "PASS — published $(grep -oE 'https://[^ ]*/s/[a-z0-9]+' build.log | head -1)"
              else
                echo "FAIL: expected a published Build Scan, none was emitted."
                verdict "FAIL — expected a published scan, none was emitted"
                exit 1
              fi
              ;;
            denied)
              if $published; then
                echo "FAIL: published to a project this credential should have no"
                echo "      access to. Access control is not holding."
                verdict "FAIL — published to a project it has no access to"
                exit 1
              elif grep -q 'denied the request to publish the build scan' build.log; then
                echo "PASS: the server denied the publish for want of project access."
                verdict "PASS — server denied the publish"
              else
                echo "INCONCLUSIVE: nothing published, but the server did not say it"
                echo "      denied the request, so the reason is unaccounted for."
                verdict "INCONCLUSIVE — nothing published, reason unaccounted for"
                exit 1
              fi
              ;;
            project-required)
              if $published; then
                echo "FAIL: published without naming any project, so unassociated"
                echo "      data is still being accepted."
                verdict "FAIL — published without naming a project"
                exit 1
              elif grep -q 'due to a project ID being required' build.log; then
                echo "PASS: the server refused a build that names no project."
                verdict "PASS — server refused a build naming no project"
              else
                echo "INCONCLUSIVE: nothing published, but not because a project ID"
                echo "      was required, so the reason is unaccounted for."
                verdict "INCONCLUSIVE — nothing published, reason unaccounted for"
                exit 1
              fi
              ;;
          esac
