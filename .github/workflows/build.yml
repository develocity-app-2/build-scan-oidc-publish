name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No wrapper and no setup-gradle/setup-java: the runner image already has
      # Gradle 9.7.1 and JDK 21, so the job downloads nothing and the build's own
      # configuration is the only Develocity config in play.
      # JAVA_HOME is set in the shell, not via `env:` with ${{ env.* }} — the
      # `env` expression context only sees workflow-defined variables, so it
      # expands runner variables like JAVA_HOME_21_X64 to the empty string.
      - name: Build
        run: JAVA_HOME="$JAVA_HOME_21_X64" gradle build
        env:
          # Static access key for now. This is the piece the experiment replaces
          # with a GitHub OIDC token exchange.
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
