name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  granted:
    name: granted project (expect publish to SUCCEED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No wrapper and no setup-gradle/setup-java: the runner image already has
      # Gradle and JDK 21, so the job downloads no toolchain and the build's own
      # configuration is the only Develocity config in play.
      - name: Build and assert a scan was published
        working-directory: projects/granted
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          set +e
          gradle build --console=plain 2>&1 | tee build.log
          echo "::notice::gradle exited with ${PIPESTATUS[0]}"
          set -e
          if grep -q 'project ID should be' build.log; then
            echo "FAIL: the plugin rejected the project ID before publishing."
            echo "      This is a configuration problem, not an access decision."
            exit 1
          fi
          if grep -qE 'grdev\.net/s/[a-z0-9]+' build.log; then
            echo "PASS: a Build Scan was published to the granted project."
          else
            echo "FAIL: expected a published Build Scan, but no scan URL was emitted."
            exit 1
          fi

  forbidden:
    name: forbidden project (expect publish to BE REJECTED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and assert the publish was rejected
        working-directory: projects/forbidden
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          set +e
          gradle build --console=plain 2>&1 | tee build.log
          echo "::notice::gradle exited with ${PIPESTATUS[0]}"
          set -e
          # A rejected publish does not fail the Gradle build, so the exit code
          # carries no signal. Assert on what the plugin printed instead -- and
          # distinguish "access denied" from "this never got as far as asking",
          # which would otherwise look identical: no scan URL either way.
          if grep -q 'project ID should be' build.log; then
            echo "INCONCLUSIVE: the plugin rejected the project ID locally, so the"
            echo "      server was never asked whether this credential may publish"
            echo "      to it. Nothing was proved about access control."
            exit 1
          fi
          if grep -qE 'grdev\.net/s/[a-z0-9]+' build.log; then
            echo "FAIL: a Build Scan was published to a project this credential"
            echo "      should have no access to. Access control is not holding."
            exit 1
          fi
          echo "PASS: no Build Scan was published to the forbidden project."

  no-project-id:
    name: no project ID (control - expect publish to SUCCEED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The control. If this publishes while granted/forbidden do not, the fault
      # is specific to the project ID path rather than to publishing.
      - name: Build and assert a scan was published
        working-directory: projects/no-project-id
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          set +e
          gradle build --console=plain 2>&1 | tee build.log
          echo "::notice::gradle exited with ${PIPESTATUS[0]}"
          set -e
          if grep -q 'project ID should be' build.log; then
            echo "FINDING: the server complained about the project ID for a build that"
            echo "      sets none. The plugin must be sending an empty project ID"
            echo "      unconditionally, which would explain the other two jobs."
            exit 1
          fi
          if grep -qE 'grdev\.net/s/[a-z0-9]+' build.log; then
            echo "PASS: a scan published with no project ID, so publishing itself is"
            echo "      healthy and the fault is specific to the project ID path."
          else
            echo "FAIL: no scan published even with no project ID. Either publishing is"
            echo "      broken outright, or 'Allow data without an associated project'"
            echo "      is unchecked now that enforcement is on."
            exit 1
          fi
